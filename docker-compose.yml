services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: realty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d realty"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/realty
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/realty
      PORT: 4000
      JWT_SECRET: local-docker-only-secret-change-before-deploy
      ACCOUNT_TOKEN_SECRET: local-docker-only-account-token-secret-change
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      PUBLIC_WEB_URL: http://localhost:${WEB_PORT:-3000}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-8000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/realty
      WORKER_CONCURRENCY: 5
      MONITOR_CANDIDATE_LIMIT: ${MONITOR_CANDIDATE_LIMIT:-5000}
      AI_PROVIDER: deterministic
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_BEARER_TOKEN: ${EMAIL_WEBHOOK_BEARER_TOKEN:-}
      ACCOUNT_TOKEN_SECRET: local-docker-only-account-token-secret-change
      PUBLIC_WEB_URL: http://localhost:${WEB_PORT:-3000}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
